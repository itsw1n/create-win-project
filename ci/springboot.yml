name: CI — Backend

on:
  push:
    branches: [dev, main]
    paths:
      - backend/**
  pull_request:
    branches: [dev, main]
    paths:
      - backend/**

permissions:
  contents: read

jobs:
  ci-backend:
    name: Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "{{JAVA_VERSION}}"
          distribution: temurin
          cache: maven
      - name: Run tests
        run: mvn --batch-mode test
      - name: Build JAR
        run: mvn --batch-mode package -DskipTests
