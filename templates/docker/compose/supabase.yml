# docker-compose.yml — {{PROJECT_NAME}} ({{STACK}}) — application + managed Supabase
services:
  frontend:
    container_name: {{PROJECT_NAME}}-frontend
    build:
      context: {{FRONTEND_DIR}}
      dockerfile: {{FRONTEND_DOCKERFILE}}
    ports:
      - "${FRONTEND_HOST_PORT:-{{FRONTEND_PORT}}}:{{FRONTEND_PORT}}"
    volumes:
      - ./{{FRONTEND_DIR}}:/app
      - /app/node_modules
    environment:
      - {{ENV_PREFIX}}SUPABASE_URL=${{ENV_PREFIX}}SUPABASE_URL
      - {{ENV_PREFIX}}SUPABASE_PUBLISHABLE_KEY=${{ENV_PREFIX}}SUPABASE_PUBLISHABLE_KEY

# The Supabase platform is managed separately. Use `supabase start` for the
# official local stack instead of approximating it with a bare PostgreSQL image.
