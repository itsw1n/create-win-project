# docker-compose.yml — {{PROJECT_NAME}} ({{STACK}}) — Dev
services:

  frontend:
    container_name: {{PROJECT_NAME}}-frontend
    build:
      context: {{FRONTEND_DIR}}
      dockerfile: {{FRONTEND_DOCKERFILE}}
    ports:
      - "${FRONTEND_HOST_PORT:-{{FRONTEND_PORT}}}:{{FRONTEND_PORT}}"
    volumes:
      - ./{{FRONTEND_DIR}}:/app
      - /app/node_modules
    environment:
      - {{ENV_PREFIX}}API_URL=${{ENV_PREFIX}}API_URL
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    container_name: {{PROJECT_NAME}}-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - uv-cache:/root/.cache/uv
    environment:
      - DATABASE_URL=postgresql+asyncpg://db:5432/${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    container_name: {{PROJECT_NAME}}-db
    image: {{POSTGRES_IMAGE}}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: {{PROJECT_NAME}}-postgres-data
  uv-cache:
    name: {{PROJECT_NAME}}-uv-cache

networks:
  app-network:
    name: {{PROJECT_NAME}}-network
