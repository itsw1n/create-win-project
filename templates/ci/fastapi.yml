name: CI — Backend

on:
  push:
    branches: [dev, main]
    paths:
      - backend/**
  pull_request:
    branches: [dev, main]
    paths:
      - backend/**

permissions:
  contents: read

jobs:
  ci-backend:
    name: Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: {{POSTGRES_IMAGE}}
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/app_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "{{PYTHON_VERSION}}"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v6
        with:
          version: "{{UV_VERSION}}"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check migrations are current
        run: uv run alembic check
      - name: Run Ruff
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run mypy
        run: uv run mypy .
      - name: Run tests
        run: uv run pytest
      - name: Build image
        run: docker build -f Dockerfile .
