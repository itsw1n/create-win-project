name: Generated compatibility

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Matrix scope to run
        type: choice
        options: [full, smoke, stack, none]
        default: full
      stack:
        description: Stack name required for stack scope
        type: string

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      current: ${{ steps.matrix.outputs.current }}
      scope: ${{ steps.matrix.outputs.scope }}
      stack: ${{ steps.matrix.outputs.stack }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MANUAL_SCOPE: ${{ inputs.scope }}
          MANUAL_STACK: ${{ inputs.stack }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            scope="$MANUAL_SCOPE"
            stack="$MANUAL_STACK"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            classification=$(git diff --name-only "origin/$BASE_REF...HEAD" | node checks/classify-changes.js)
            scope=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).scope)' "$classification")
            stack=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).stack || "")' "$classification")
          else
            scope="full"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "stack=$stack" >> "$GITHUB_OUTPUT"
          echo "current=$(node -e 'const c=require("./library/tested-versions.json"); process.stdout.write(c.defaultProfile)')" >> "$GITHUB_OUTPUT"
          matrix_scope="$scope"
          if [ "$scope" = "none" ]; then matrix_scope="smoke"; fi
          stack_arg=""
          if [ -n "$stack" ]; then stack_arg="--stack=$stack"; fi
          echo "matrix=$(node checks/check-compatibility.js --scope=$matrix_scope $stack_arg)" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    if: needs.prepare.outputs.scope != 'none'
    name: shard ${{ matrix.shard }} / 4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: contains(toJSON(matrix.cases), 'springboot')
        with:
          java-version: '21'
          distribution: temurin
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: contains(toJSON(matrix.cases), 'laravel')
        with:
          php-version: '8.5.10'
          extensions: pdo_pgsql
          coverage: none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: contains(toJSON(matrix.cases), 'fastapi')
        with:
          python-version: '3.13.15'
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        if: contains(toJSON(matrix.cases), 'fastapi')
        with:
          version: '0.12.10'
      - run: npm ci
      - name: Verify generated application
        env:
          COMPATIBILITY_CASES: ${{ toJSON(matrix.cases) }}
          CURRENT_PROFILE: ${{ needs.prepare.outputs.current }}
          VERIFY_CONTAINERS: ${{ needs.prepare.outputs.scope == 'full' }}
        run: node checks/run-compatibility-shard.js

  compatibility-gate:
    name: compatibility-gate
    if: always()
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every generated-project check
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SCOPE: ${{ needs.prepare.outputs.scope }}
        run: |
          test "$PREPARE_RESULT" = "success"
          if [ "$SCOPE" = "none" ]; then
            test "$VERIFY_RESULT" = "skipped"
          else
            test "$VERIFY_RESULT" = "success"
          fi
