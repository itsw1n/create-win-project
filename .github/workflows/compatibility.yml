name: Generated compatibility

on:
  pull_request:
    paths:
      - compatibility/**
      - lib/**
      - playbooks/**/*.manifest.json
      - templates/**
      - ci/**
      - scripts/verify-generated.mjs
      - package.json
      - package-lock.json
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      current: ${{ steps.catalog.outputs.current }}
    steps:
      - uses: actions/checkout@v4
      - id: catalog
        run: |
          echo "matrix=$(node -e 'const c=require("./compatibility/profiles.json"); const cases=["nextjs-none","nextjs-supabase","nextjs-springboot","nextjs-postgres","react-none","react-supabase","react-springboot","react-native-supabase","react-native-springboot","react-native-none"]; const auths=x=>[...["not-yet","none"].map(authentication=>({authentication,audience:x.startsWith("react-native")?"multi-client":"website"})),...(x.includes("supabase")?[{authentication:"yes",audience:x.startsWith("react-native")?"multi-client":"website"}]:[]),...(x.includes("springboot")?[{authentication:"yes",audience:"website"},{authentication:"yes",audience:"multi-client"}]:[])]; process.stdout.write(JSON.stringify(Object.entries(c.profiles).flatMap(([profile,p])=>cases.flatMap(caseName=>["small","medium","large"].flatMap(architecture=>auths(caseName).map(a=>({profile,case:caseName,architecture,...a,node:p.runtimes.node,java:p.runtimes.java})))))))')" >> "$GITHUB_OUTPUT"
          echo "current=$(node -e 'const c=require("./compatibility/profiles.json"); process.stdout.write(c.defaultProfile)')" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    name: ${{ matrix.profile }} / ${{ matrix.case }} / ${{ matrix.architecture }} / ${{ matrix.authentication }} / ${{ matrix.audience }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-java@v4
        if: contains(matrix.case, 'springboot')
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - run: npm ci
      - run: npm test
      - run: npm run validate:content
      - run: npm pack --dry-run
      - name: Verify generated application
        run: node scripts/verify-generated.mjs --profile=${{ matrix.profile }} --case=${{ matrix.case }} --architecture=${{ matrix.architecture }} --authentication=${{ matrix.authentication }} --auth-audience=${{ matrix.audience }} --containers=${{ matrix.profile == needs.prepare.outputs.current }}
