name: Generated compatibility

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Matrix scope to run
        type: choice
        options: [full, smoke, stack, none]
        default: full
      stack:
        description: Stack name required for stack scope
        type: string

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      current: ${{ steps.matrix.outputs.current }}
      scope: ${{ steps.matrix.outputs.scope }}
      stack: ${{ steps.matrix.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MANUAL_SCOPE: ${{ inputs.scope }}
          MANUAL_STACK: ${{ inputs.stack }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            scope="$MANUAL_SCOPE"
            stack="$MANUAL_STACK"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            classification=$(git diff --name-only "origin/$BASE_REF...HEAD" | node checks/classify-changes.js)
            scope=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).scope)' "$classification")
            stack=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).stack || "")' "$classification")
          else
            scope="full"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "stack=$stack" >> "$GITHUB_OUTPUT"
          echo "current=$(node -e 'const c=require("./library/tested-versions.json"); process.stdout.write(c.defaultProfile)')" >> "$GITHUB_OUTPUT"
          matrix_scope="$scope"
          if [ "$scope" = "none" ]; then matrix_scope="smoke"; fi
          stack_arg=""
          if [ -n "$stack" ]; then stack_arg="--stack=$stack"; fi
          echo "matrix=$(node checks/check-compatibility.js --scope=$matrix_scope $stack_arg)" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    if: needs.prepare.outputs.scope != 'none'
    name: shard ${{ matrix.shard }} / ${{ matrix.profile }} / ${{ matrix.case }} / ${{ matrix.architecture }} / ${{ matrix.authentication }} / ${{ matrix.audience }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-java@v4
        if: contains(matrix.case, 'springboot')
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - uses: shivammathur/setup-php@v2
        if: contains(matrix.case, 'laravel')
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql
          coverage: none
      - run: npm ci
      - name: Verify generated application
        run: node checks/check-generated-project.js --profile=${{ matrix.profile }} --case=${{ matrix.case }} --architecture=${{ matrix.architecture }} --authentication=${{ matrix.authentication }} --auth-audience=${{ matrix.audience }} --containers=${{ needs.prepare.outputs.scope == 'full' && matrix.profile == needs.prepare.outputs.current }}

  compatibility-gate:
    name: compatibility-gate
    if: always()
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every generated-project check
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SCOPE: ${{ needs.prepare.outputs.scope }}
        run: |
          test "$PREPARE_RESULT" = "success"
          if [ "$SCOPE" = "none" ]; then
            test "$VERIFY_RESULT" = "skipped"
          else
            test "$VERIFY_RESULT" = "success"
          fi
