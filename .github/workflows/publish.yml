name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  checks: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require compatibility gate on this release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "compatibility-gate")][0].conclusion // "missing"')
          test "$conclusion" = "success"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
