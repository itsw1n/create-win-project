# =============================================================================
# docker-compose.yml — create-win-project CLI (clone & run, no host Node)
# Usage:
#   docker compose run --rm app              # interactive interview
#   docker compose run --rm app npm test     # tests without host Node
#   docker compose run --rm --entrypoint sh app  # shell
# =============================================================================
services:
  app:
    build: .
    image: create-win-project:dev
    stdin_open: true
    tty: true
    # Run as the host user so bind-mounted files (generated projects,
    # .demo/, node_modules) are owned by you, not root — make clean works
    # without sudo. UID/GID are exported by the Makefile (default 1000).
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # Non-root HOME must stay writable (npm cache during installs)
      HOME: /tmp
    volumes:
      - .:/app
      - /app/node_modules
      - ./.demo:/app/.demo
